<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styling/main-styling.css">
    <link rel="stylesheet" href="../styling/search-books.css">
    <link rel="icon" type="image/png" href="../img/book-logo.png" />
    <title>Search Books</title>
</head>

<body>
    <div class="navbar">
        <div class="logo">
            <a href="../html/index.html"><img src="../img/book-logo.png" alt="logo of"> <span>Online Library</span>
            </a>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="borrowed-books.html">Borrowed</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </div>
    <header>
        <h1>Search Books</h1>
    </header>
    <main>
        <form method="get" action="">
            <div>
                <label for="search-query">Search:</label>
                <input type="text" id="search-query" name="search_query" placeholder="Search by Title or Author"
                    required autofocus>
            </div>
            <div>
                <label for="category">Category:</label>
                <select id="category" name="category">
                    <option value="" selected>All Categories</option>
                    <option value="biography">Trending</option>
                    <option value="coding">Coding</option>
                    <option value="novels">Novels</option>
                </select>
            </div>
            <div class="buttons">
                <button id="search-button" type="submit">Search</button>
                <button id="reset-button" type="reset">Reset</button>
            </div>
        </form>
        <div id="search-results">
            <!-- Search results will be displayed here -->
        </div>
    </main>
    <script src="../js/search.js"></script>
</body>
<footer>
    <p>Developed by Yasser Mohamed</p>
</footer>

</html>
