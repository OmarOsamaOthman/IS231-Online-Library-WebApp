<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styling/main-styling.css" />
  <link rel="stylesheet" href="../styling/Signup.css" />

  <link rel="icon" type="image/png" href="../img/book-logo.png" />

  <title>Sign Up</title>
</head>

<body>
  <div class="navbar">
    <div class="logo">
      <a href="../html/index.html"><img src="../img/book-logo.png" alt="logo of" />
        <span>Online Library</span>
      </a>
    </div>

    <nav>
      <ul>
        <li><a href="../html/index.html">Home</a></li>
        <li><a href="../html/login.html">Login</a></li>
        <li><a href="../html/about.html">About</a></li>
      </ul>
    </nav>
  </div>

  <header>
    <h1>Sign Up</h1>
  </header>

  <main>
    <form class="form" onsubmit="handleLogin(event)">

      <!-- <div>
        <label> Your Name</label>
        <input type="text" name="First Name" id="FirstName" required />
      </div> -->

      <div>
        <label> User Name</label>
        <input type="text" name="User Name" id="UserName" autofocus />
      </div>

      <div>
        <label>Password</label>
        <input type="password" name="Password" id="Password" required />
      </div>

      <div>
        <label>Email</label>
        <input type="email" name="Email" id="Email" />
      </div>

      <div>
        <label>Phone</label>
        <input type="tel" name="Phone" id="Phone" />
      </div>

      <div class="admin">
        <input type="checkbox" class="check-box" id="is-admin" />
        <label for="is-admin">Are You Admin?</label>
      </div>

      <div class="buttons">
        <button type="submit" class="signup">Sign Up</button>
      </div>
      <p class="login-link">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </form>
  </main>

  <script src="../js/signup.js"></script>
</body>

</html>
