    <main>

        <form class="form" onsubmit="handleLogin(event)">
            <div>
                <label> First Name</label>
                <input type="text" name="First Name" id="FirstName" required>
            </div>

            <div>
                <label> Second Name</label>
                <input type="text" name="Second Name" id="SecondName" required>
            </div>

            <div>
                <label> User Name</label>
                <input type="text" name="User Name" id="UserName" required>
            </div>


            <div>
                <label>Password</label>
                <input type="password" name="Password" id="Password" required>
            </div>

            <div>
                <label> Confirm Password</label>
                <input type="password" name="Confirm Password" id="ConfirmPassword" required>
            </div>

            <div>
                <label>Email</label>
                <input type="email" name="Email" id="Email" required>
            </div>

            <div>
                <label>Phone</label>
                <input type="tel" name="Phone" id="Phone" required>
            </div>

            <div>
                <label>Role</label>
                <select name="role" id="role">
                    <option value="" selected>Choose Your role</option>
                    <option value="admin">Admin</option>
                    <option value="user">User</option>
                </select>
            </div>

            <div class="buttons">
                <button type="submit" class="signup">Sign Up </button>
            </div>
            <p class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </form>
    </main>

    <script src="../js/signup.js"></script>
</body>
