<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styling/main-styling.css" />
  <link rel="stylesheet" href="../styling/login.css" />

  <link rel="icon" type="image/png" href="../img/book-logo.png" />

  <title>Login</title>
</head>



<body>
  <div class="navbar">
    <div class="logo">
      <a href="../html/index.html"><img src="../img/book-logo.png" alt="logo of" />
        <span>Online Library</span>
      </a>
    </div>

    <nav>
      <ul>
        <li><a href="../html/index.html">Home</a></li>
        <li><a href="../html/Signup.html">Sign Up</a></li>
        <li><a href="../html/about.html">About</a></li>
      </ul>
    </nav>
  </div>

  <header>
    <h1>Login</h1>
  </header>

  <main class="content">
    <form class="form" onsubmit="handleLogin(event)">
      <div>
        <label> User Name</label>
        <input type="text" name="User Name" id="UserName" required />
      </div>

      <div>
        <label>Password</label>
        <input type="password" name="Password" id="Password" required />
      </div>

      <div class="buttons">
        <button type="submit" class="login-btn">Login</button>
      </div>
      <p class="signup-link">
        Don't have an account? <a href="Signup.html">Create an account</a>
      </p>
    </form>
  </main>

  <script src="../js/login.js"></script>
</body>

</html>
