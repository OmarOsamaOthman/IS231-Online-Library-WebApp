<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Details</title>
    <link rel="stylesheet" href="../styling/book-detail.css" />
    <link rel="stylesheet" href="../styling/Add-book-styling.css" />
    <link rel="icon" type="image/png" href="../img/book-logo.png" />
  </head>

  <body>
    <div class="navbar">
      <div class="logo">
        <a href="../html/library.html"
          ><img src="../img/book-logo.png" alt="logo of" />
          <span>Online Library</span>
        </a>
      </div>

      <nav>
        <ul>
          <li><a href="../html/library.html">Home</a></li>
          <li><a href="../html/books.html">Books</a></li>
          <li><a href="../html/about.html">About</a></li>
          <li><a href="#">Logout</a></li>
        </ul>
      </nav>
    </div>

    <div class="details-container">
      <div class="details-card">
        <img id="image-book" src="" alt="" />

        <div class="book-info">
          <h2 id="title-book"></h2>
          <p><strong>Author:</strong> <span id="author-book"></span></p>
          <p><strong>Category:</strong> <span id="category-book"></span></p>
          <p><strong>Status:</strong> <span id="status-book"></span></p>
          <p>
            <strong>Description:</strong> <span id="description-book"></span>
          </p>

          <button>Borrow</button>
        </div>
      </div>
    </div>
    <script src="../js/book-detail.js"></script>
  </body>
</html>
