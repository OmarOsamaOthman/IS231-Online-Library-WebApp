<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books List</title>
  <link rel="stylesheet" href="../styling/books.css" />
  <link rel="stylesheet" href="../styling/main-styling.css">

  <link rel="icon" type="image/png" href="../img/book-logo.png" />
</head>

<body>


  <div class="navbar">
    <div class="logo">
      <a href="../html/library.html"><img src="../img/book-logo.png" alt="logo of" />
        <span>Online Library</span>
      </a>
    </div>

    <nav>
      <ul>
        <li><a href="../html/library.html">Home</a></li>
        <li><a href="Add-book.html">Add Book</a></li>
        <li><a href="../html/about.html">About</a></li>
        <li><a href="../html/library.html">Logout</a></li>
        <input type="checkbox" name="" id="is-admin">Are You Admin?
      </ul>
    </nav>
  </div>

  <!-- <button id="Add-book" style="display: none;">Add Book</button> -->

  <div class="books-list">
    <div class="book-category">
      <h2 class="head">Trending</h2>
      <div class="category-row">
        <button class="slider-btn prev" data-target="main-books">‹</button>
        <section id="main-books" class="book-track"></section>
        <button class="slider-btn next" data-target="main-books">›</button>
      </div>
    </div>

    <div class="book-category">
      <h2 class="head">Coding</h2>
      <div class="category-row">
        <button class="slider-btn prev" data-target="Coding-books">‹</button>
        <section id="Coding-books" class="book-track"></section>
        <button class="slider-btn next" data-target="Coding-books">›</button>
      </div>
    </div>

    <div class="book-category">
      <h2 class="head">Novels</h2>
      <div class="category-row">
        <button class="slider-btn prev" data-target="Novels">‹</button>
        <section id="Novels" class="book-track"></section>
        <button class="slider-btn next" data-target="Novels">›</button>
      </div>
    </div>
  </div>
  <div id="congrats" style="
        display: none;
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #4caf50;
        color: white;
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 18px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      ">
    Book borrowed Succesfully✅!


    <div id="warning" style="
        display: none;
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: red;
        color: white;
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 18px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      ">
      Sorry, Book is Unavilabile ☹️
    </div>
    <script src="../js/Books-logic.js"></script>
</body>

</html>
